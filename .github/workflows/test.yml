name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # 单元测试是门禁：执行全仓 JVM 测试，任何测试失败都会使工作流失败。
  unit-tests:
    name: 单元测试与跨平台验证
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行全仓 JVM 单元测试
        run: ./gradlew jvmTest --console=plain

      - name: 编译解析器与渲染器的 JS 和 Wasm 测试
        run: >-
          ./gradlew
          :latex-parser:compileTestKotlinJs :latex-parser:compileTestKotlinWasmJs
          :latex-renderer:compileTestKotlinJs :latex-renderer:compileTestKotlinWasmJs
          --console=plain

      - name: 在 Chrome 中验证 JS 和 Wasm 对象身份
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          export CHROME_BIN
          ./gradlew \
            :latex-renderer:jsBrowserTest --tests '*LayoutIdentityTest*' \
            :latex-renderer:wasmJsBrowserTest --tests '*LayoutIdentityTest*' \
            --console=plain
          # 浏览器筛选为空也可能返回成功，因此额外确认两个目标确实执行了用例。
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for target in ("jsBrowserTest", "wasmJsBrowserTest"):
              reports = Path("latex-renderer/build/test-results", target).glob("TEST-*.xml")
              count = sum(int(ET.parse(report).getroot().get("tests", 0)) for report in reports)
              if count < 2:
                  raise SystemExit(f"{target}: 预期至少执行 2 项身份哈希测试，实际 {count}")
              print(f"{target}: 已执行 {count} 项测试")
          PY

      - name: 保存单元测试与浏览器测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14

  # 性能仅报告 GOOD/BAD，不作合入门禁；采样异常仍保留失败步骤、警告和产物。
  layout-cache-performance:
    name: 布局缓存性能报告
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: 授予 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行 JMH 并采集 GC 分配指标
        run: |
          mkdir -p latex-benchmark/build/reports/layout-cache
          ./gradlew :latex-benchmark:layoutCacheJmh -PlayoutCacheGc=true --console=plain 2>&1 \
            | tee latex-benchmark/build/reports/layout-cache/benchmark.log

      - name: 生成 GOOD/BAD 报告并写入运行摘要
        if: always()
        run: |
          report_json=latex-benchmark/build/reports/layout-cache/jmh.json
          report_md=latex-benchmark/build/reports/layout-cache/summary.md
          if [[ -s "$report_json" ]]; then
            python3 latex-benchmark/report_layout_cache.py "$report_json" --output "$report_md"
            cat "$report_md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::未生成 JMH 结果，请查看性能采样日志。'
            echo '性能采样未生成结果，请查看日志与报告附件。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 标记性能工具异常
        if: failure()
        run: echo '::warning::性能采样或报告生成失败；该任务不拦截合入，请检查日志与附件。'

      - name: 保存性能结果、报告与采样日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-cache-performance
          path: latex-benchmark/build/reports/**
          retention-days: 30
